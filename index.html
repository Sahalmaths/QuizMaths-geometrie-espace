<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion PK12</title>
<style>
body{font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f4ff;margin:0}
.card{background:white;padding:30px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,0.1);width:90%;max-width:400px;text-align:center;border-top:5px solid #00e5ff}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{width:100%;padding:12px;background:#00e5ff;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin-top:10px}
button:hover{background:#00b3cc}
.error{color:red;margin-top:10px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
<h2>Lycée PK12</h2>
<p>Quiz Géométrie & Arithmétique</p>
<input type="text" id="nom" placeholder="Nom de l'élève (Ex: OMAR ABDI)">
<select id="niveau">
<option value="">-- Choisir Niveau --</option>
<option value="Seconde">Seconde</option>
<option value="Terminale">Terminale S</option>
</select>
<input type="password" id="mdp" placeholder="Mot de passe">
<button onclick="connexion()">Entrer</button>
<div id="erreur" class="error"></div>
</div>
<script>
function connexion(){
 let nom=document.getElementById("nom").value.trim();
 let niveau=document.getElementById("niveau").value;
 let mdp=document.getElementById("mdp").value.trim();
 let erreur=document.getElementById("erreur");
 if(!nom || !niveau || !mdp){erreur.innerText="Remplis tout !";return;}
 if(mdp!=="Lycée Pk12"){erreur.innerText="Mot de passe incorrect ! Mets: Lycée Pk12";return;}
 localStorage.setItem("nomEleve",nom);
 localStorage.setItem("niveauEleve",niveau);
 // REDIRECTION AUTOMATIQUE
 if(niveau==="Terminale"){
   window.location.href="congruences.html";
 } else {
   window.location.href="Plan-droites.html";
 }
}
</script>
</div>
</body>
</html>
