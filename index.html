<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion PK12</title>
<style>
body{font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#f0f4ff;margin:0;padding:20px 0}
.card{background:#fff;padding:30px 40px 45px;border-radius:16px;box-shadow:0 6px 25px rgba(0,0,0,0.12);width:94%;max-width:640px;min-height:560px;text-align:center;border-top:6px solid #00e5ff;box-sizing:border-box}
.header-logos{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{height:90px;width:auto;max-width:45%;object-fit:contain}
h2{font-size:1.8em;margin:10px 0 5px}
p{font-size:1.1em;color:#555;margin-bottom:25px}
input,select{width:100%;padding:15px;margin:10px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-size:1.05em}
button{width:100%;padding:15px;background:#00e5ff;border:none;border-radius:10px;font-weight:bold;font-size:1.1em;cursor:pointer;margin-top:15px}
button:hover{background:#00b3cc}
.error{color:red;margin-top:12px;font-weight:bold}
</style>
</head>
<body>
<div class="card">
  <div class="header-logos">
    <img class="logo" src="https://lh3.googleusercontent.com/d/1w4kD5V6ZetBSrgyXssJbpaq_pI5LLVdm" alt="Logo MENFOP">
    <img class="logo" src="https://lh3.googleusercontent.com/d/1Ji5tKVxyoCgp8X2RAD8WBoFDMEaONfKR" alt="Logo Lycée PK12">
  </div>
  <h2>Lycée PK12</h2>
  <p>Quiz Géométrie &amp; Arithmétique</p>
  <input type="text" id="nom" placeholder="Nom de l'élève (Ex: OMAR ABDI)">
  <select id="niveau">
    <option value="">-- Choisir Niveau --</option>
    <option value="Seconde">Seconde</option>
    <option value="Terminale">Terminale S</option>
  </select>
  <input type="password" id="mdp" placeholder="Mot de passe">
  <button onclick="connexion()">Connexion</button>
  <div id="erreur" class="error"></div>
</div>

<script>
function connexion(){
  let nom=document.getElementById("nom").value.trim();
  let niveau=document.getElementById("niveau").value;
  let mdp=document.getElementById("mdp").value.trim();
  let erreur=document.getElementById("erreur");
  if(!nom || !niveau || !mdp){erreur.innerText="Remplis tout !";return;}
  if(mdp!=="Lycée Pk12"){erreur.innerText="Mot de passe incorrect !";return;}
  localStorage.setItem("nomEleve",nom);
  localStorage.setItem("niveauEleve",niveau);
  if(niveau==="Terminale"){
    window.location.href="congruences.html";
  } else {
    window.location.href="Plan-droites.html";
  }
}
</script>
</body>
</html>
